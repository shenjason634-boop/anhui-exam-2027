</style></head><body><main class="wrap"><div class="panel"><h1>2027安徽省考 · 进阶诊断</h1><p class="muted">30题｜35分钟｜原创进阶模拟题（非历年真题）｜言语10 + 判断10 + 资料10</p><div class="stats"><span class="pill" id="clock">剩余 35:00</span><span class="pill" id="count">已答 0/30</span><span class="pill" id="where">准备开始</span></div><div class="bar"><div class="fill" id="progress" style="width:0%"></div></div><section id="intro"><h2>答题须知</h2><p>这是按2026年安徽省考大纲考查方向设计的原创诊断题，不是官方真题。每题单选，支持上一题、下一题、跳题、暂停与继续；同一浏览器自动保存作答。倒计时到0自动交卷。建议不查资料、不使用计算器。</p><p>答完后可查看每题正确答案和解析，并导出 JSON 成绩文件供后续分析。</p><div class="actions"><button class="btn" id="start">开始 / 继续答题</button><button class="btn secondary" id="reset">清空旧记录</button></div></section><section id="exam" class="hidden"><div class="nav" id="nav"></div><div id="question" class="q"></div><div id="opts"></div><div class="actions"><button class="btn secondary" id="prev">上一题</button><button class="btn" id="next">下一题</button><button class="btn secondary" id="pause">暂停</button><button class="btn danger" id="submit">交卷</button></div></section><section id="result" class="hidden"><h2>诊断报告</h2><div id="summary"></div><div class="actions"><button class="btn" id="export">导出成绩 JSON</button><button class="btn secondary" id="review">查看逐题解析</button><button class="btn danger" id="again">重新作答</button></div><div id="details" class="hidden"></div></section><p class="muted small">文件完全离线运行，数据保存在当前浏览器；换设备或清理浏览器数据可能丢失记录，请及时导出成绩。</p></div></main><script>
'use strict';
const Q=[{"module": "言语理解", "question": "面对城市更新，一些地方热衷于打造视觉上整齐划一的街区，却忽略了街巷尺度、邻里交往与小店经济之间的联系。历史街区的价值不仅体现在建筑立面，更体现在长期形成的生活网络。若只保留外观而迁走原有业态，所谓“保护”可能反而削弱街区活力。这段文字意在强调：", "options": ["历史街区改造应优先恢复传统建筑风格", "城市更新需要兼顾空间形态与原有生活生态", "历史街区的商业价值高于文化价值", "统一街区外观是改善居民生活的前提"], "correct": 1, "explain": "重点是“外观保护不足以维系街区活力”，应兼顾生活网络。", "sub": "意图判断"}, {"module": "言语理解", "question": "科学研究中的负面结果并非毫无价值。一个未能证实预期的实验，如果方法可靠、数据完整，仍能帮助同行排除错误路径。然而，发表机制偏好“显著发现”，容易让此类结果被搁置，造成其他团队重复投入。作者最可能赞同：", "options": ["应降低科研论文的方法学要求", "未证实假设的研究都应优先发表", "完善科研评价和发表机制有助于减少重复试错", "实验结果不显著说明原研究假设缺乏意义"], "correct": 2, "explain": "文段指出发表偏好带来的重复试错问题，落点在机制完善。", "sub": "意图判断"}, {"module": "言语理解", "question": "数字化转型不是把纸质流程搬到线上。若审批层级、数据壁垒和责任边界没有调整，系统越多，员工反而可能在不同平台重复录入信息。因此，技术投入必须与组织流程再造____，否则容易出现“工具先进、效率不高”的悖论。", "options": ["相提并论", "相辅相成", "分庭抗礼", "背道而驰"], "correct": 1, "explain": "“必须与……相辅相成”表示互相配合促进。", "sub": "逻辑填空"}, {"module": "言语理解", "question": "对新兴产业进行监管，既不能因为风险尚不明确就____，也不能因为鼓励创新便放弃必要约束。更可行的方式是设置可调整的规则，在实践中持续收集证据并及时修订。", "options": ["因噎废食", "无所适从", "削足适履", "投鼠忌器"], "correct": 0, "explain": "因噎废食指因担心出问题而索性不做，契合前半句。", "sub": "逻辑填空"}, {"module": "言语理解", "question": "①真正有效的公共参与，不只是让公众在方案形成后表达赞成或反对。②如果意见征集只发生在决策末端，许多关键选择事实上已经无法改变。③这就要求在问题界定、方案比较等早期环节提供参与机会。④只有这样，公众意见才可能实质性影响决策。将以上四句排列，最恰当的是：", "options": ["①②③④", "②①④③", "③①②④", "①③④②"], "correct": 0, "explain": "先提出观点，再说明末端参与的不足，继而提出要求并总结。", "sub": "语句排序"}, {"module": "言语理解", "question": "“算法推荐提高了内容分发效率”并不等于“用户接触的信息更加多元”。平台若主要根据既有点击行为推送内容，用户的短期偏好可能不断被强化，而原本不熟悉的观点更难进入视野。根据文段，下列说法正确的是：", "options": ["算法推荐必然导致所有用户观点极端化", "分发效率提升与信息多元化之间没有必然联系", "只要用户主动搜索就能消除推荐偏差", "平台推荐内容主要由人工编辑决定"], "correct": 1, "explain": "首句明确否定两者的必然等同，其他选项过度推断。", "sub": "细节理解"}, {"module": "言语理解", "question": "地方产业政策的效果往往具有滞后性：研发平台建设、技术人才积累与供应链形成都需要时间。因此，若只用项目落地当年的产值评判政策，很可能____其长期价值；但若完全不设置阶段性指标，又会使政策执行缺少____。", "options": ["高估／弹性", "低估／约束", "夸大／方向", "忽视／创新"], "correct": 1, "explain": "长期效果未显现会被低估；阶段性指标提供约束。", "sub": "逻辑填空"}, {"module": "言语理解", "question": "一些博物馆尝试用沉浸式技术重现历史场景。技术确实可以降低理解门槛，但若过分 setInterval(tick,1000);
function finish(){s.finished=true;s.paused=true;save();report()}
function report(){screen('result');const modules=['言语理解','判断推理','资料分析'];let correct=Q.reduce((n,q,i)=>n+(s.answers[i]===q.correct),0);let h=`<p><strong>总分：${(correct/30*100).toFixed(1)}分</strong>（答对${correct}/30题，未答${30-Object.keys(s.answers).length}题）</p><p>实际计时：${fmt(2100-s.remaining)}，剩余：${fmt(s.remaining)}</p>`;for(const m of modules){let ids=Q.map((q,i)=>q.module===m?i:-1).filter(i=>i>=0),n=ids.filter(i=>s.answers[i]===Q[i].correct).length,seconds=ids.reduce((a,i)=>a+s.times[i],0);h+=`<p>${m}：${n}/10（${n*10}%）｜耗时${fmt(seconds)}</p>`}$('summary').innerHTML=h;}
$('start').onclick=()=>{s.started=true;s.paused=false;lastTick=Date.now();save();render()};$('prev').onclick=()=>{if(s.current>0){s.current--;save();render()}};$('next').onclick=()=>{if(s.current<29){s.current++;save();render()}};$('pause').onclick=()=>{s.paused=!s.paused;lastTick=Date.now();save();render()};$('submit').onclick=()=>{if(confirm(`已答${Object.keys(s.answers).length}题，确定交卷并查看答案吗？`))finish()};
function reset(){if(confirm('确定清空本次全部作答记录吗？')){localStorage.removeItem(KEY);location.reload()}}$('reset').onclick=reset;$('again').onclick=reset;
$('review').onclick=()=>{let d=$('details');d.classList.toggle('hidden');if(d.classList.contains('hidden'))return;d.innerHTML=Q.map((q,i)=>{let a=s.answers[i],ok=a===q.correct;return `<div class="report"><strong class="${ok?'good':'bad'}">第${i+1}题 · ${q.module} · ${ok?'正确':'错误或未答'}</strong><p>${esc(q.question).replace(/\n/g,'<br>')}</p><p>你的答案：${a===undefined?'未答':'ABCD'[a]}｜正确答案：${'ABCD'[q.correct]}｜用时：${Math.round(s.times[i])}秒</p><p>解析：${esc(q.explain)}</p></div>`}).join('')};
$('export').onclick=()=>{const data={title:'2027安徽省考30题进阶原创模拟',exportedAt:new Date().toISOString(),finished:s.finished,remainingSeconds:s.remaining,answers:s.answers,times:s.times,questions:Q.map((q,i)=>({module:q.module,sub:q.sub,question:q.question,options:q.options,answer:s.answers[i]===undefined?null:'ABCD'[s.answers[i]],correct:'ABCD'[q.correct],seconds:Math.round(s.times[i]),explain:q.explain}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='2027省考进阶摸底_答题数据.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
render();
</script></body></html>
